openapi: 3.1.0
info:
  title: Payments Reconciliation and Exceptions Platform API
  version: 0.4.0
  description: >
    Ingestion (Phase 2), reconciliation run (Phase 3) and exception management (Phase 4) endpoints. Authentication and role enforcement arrive in Phase 8; until then the roles
    shown in x-required-roles are documented intent, not enforced. All data is synthetic.
servers:
  - url: http://localhost:8080
paths:
  /api/v1/ingestions/statements:
    post:
      summary: Upload a bank statement
      description: >
        The request body is the raw file. Identity is the SHA-256 of the exact bytes, so retries are safe: a file
        already ingested returns 200 with duplicate true and changes nothing.
      x-required-roles: [ADMIN]
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string }
            example: |
              account,booking_date,value_date,amount,currency,reference,counterparty,narrative
              ACC-1,,2026-10-09,1250.50,GBP,INV-2026-0042,Acme Trading Ltd,invoice payment
          application/xml:
            schema: { type: string, description: Simplified camt.053 }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '200': { $ref: '#/components/responses/Duplicate' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/ingestions/ledger:
    post:
      summary: Submit ledger entries
      description: >
        CSV (same columns plus optional entry_id) or a JSON array of flat objects whose values are strings or null.
        For JSON the file identity is the canonical form (fixed field order, compact, null and missing equal), so
        the same entries with different key order or whitespace are a duplicate. An entry_id already stored is
        rejected per line as DUPLICATE_LEDGER_ENTRY (identical content) or LEDGER_ENTRY_CONFLICT (different content).
      x-required-roles: [ADMIN]
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string }
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/LedgerEntry' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '200': { $ref: '#/components/responses/Duplicate' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/ingestions/{id}:
    get:
      summary: Read back an ingestion
      description: Counts are exact. rejectedLines lists at most the first 1000 rejected lines, in line order.
      x-required-roles: [ADMIN, ANALYST, AUDITOR]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: The ingestion
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestionDetail' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/reconciliations/runs:
    post:
      summary: Start a reconciliation run
      description: >
        Fixes the run's inputs (the named statement ingestions and every ledger entry committed at that moment),
        matches them, stores the result and returns the finished run. Omitted configuration fields take the BRD
        defaults. Error codes: RUN_REQUEST_INVALID and MALFORMED_REQUEST (400); RUN_UNKNOWN_INGESTION and
        RUN_NOT_A_STATEMENT_INGESTION (422). A run that fails unexpectedly is stored as FAILED and the client
        receives the generic INTERNAL_ERROR (500); the cause is in the server log only.
      x-required-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartRunRequest' }
            example:
              businessDate: '2026-10-09'
              statementIngestionIds: [1]
              config: { autoThresholdMilli: 950, reviewThresholdMilli: 700 }
      responses:
        '201':
          description: The completed run
          headers:
            Location: { schema: { type: string }, description: '/api/v1/reconciliations/runs/{id}' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunDetail' }
        '400': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/reconciliations/runs/{id}:
    get:
      summary: Read a run
      description: The run's definition, status, summary and output hash. Error code RUN_NOT_FOUND (404).
      x-required-roles: [ADMIN, ANALYST, TEAM_LEAD, CONTROLLER, AUDITOR]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: The run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunDetail' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/reconciliations/runs/{id}/results:
    get:
      summary: Page through a completed run's results
      description: >
        One view at a time, in ordinal order, paged by cursor: pass the previous page's nextAfter as after. A page
        counts matches or exceptions, never lines. nextAfter is null on the last page. Error codes: RUN_NOT_FOUND
        (404); RUN_NOT_COMPLETED (409); INVALID_RESULT_VIEW and INVALID_PAGE_PARAMETER (400).
      x-required-roles: [ADMIN, ANALYST, TEAM_LEAD, CONTROLLER, AUDITOR]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - name: view
          in: query
          schema: { type: string, enum: [matches, exceptions, carried-forward, notes], default: matches }
        - name: after
          in: query
          description: Cursor. The last ordinal of the previous page (ledger sequence for carried-forward); 0 for the first page.
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '200':
          description: One page of the chosen view
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultPage' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/reconciliations/runs/{id}/replay:
    post:
      summary: Replay a completed run
      description: >
        Recomputes the run from its stored inputs and configuration and compares the new output hash with the one
        stored when it completed (FRD-10). identical false means the stored inputs or the engine changed. The stored
        run is never modified. Error codes: RUN_NOT_FOUND (404); RUN_NOT_COMPLETED and
        RUN_REPLAY_INPUTS_UNAVAILABLE (409).
      x-required-roles: [ADMIN, AUDITOR]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: The two hashes and whether they agree
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReplayResult' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/reconciliations/runs/{id}/exceptions:
    post:
      summary: Open the cases for a completed run
      description: >
        Creates a work item for every exception of the run. Safe to repeat: a case exists once per natural key, so a
        second call creates nothing new and alreadyOpen counts the ones that were there. Phase 7 replaces this
        explicit call with an event consumer.
      x-required-roles: [ADMIN, TEAM_LEAD]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: How many exceptions the run holds and how many became new cases
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntakeResult' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/exceptions:
    get:
      summary: List the exception queue
      description: >
        Cases in id order. Filter by status, team, priority, kind and owner (enum values are case-insensitive).
        Page with after (the nextAfter of the previous page) and limit (1 to 500, default 100).
      x-required-roles: [ADMIN, ANALYST, TEAM_LEAD, CONTROLLER, AUDITOR]
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [OPEN, ASSIGNED, INVESTIGATING, RESOLVED, ESCALATED] } }
        - { name: team, in: query, required: false, schema: { type: string, enum: [FX_TEAM, SENIOR_ANALYST, LEDGER_OPERATIONS, BANK_OPERATIONS, RECON_ANALYSTS, TEAM_LEAD] } }
        - { name: priority, in: query, required: false, schema: { type: string, enum: [P1, P2, P3, P4] } }
        - { name: kind, in: query, required: false, schema: { type: string, enum: [MISSING_LEDGER, MISSING_STATEMENT, AMOUNT_MISMATCH, CURRENCY_MISMATCH, DUPLICATE_SUSPECT, LOW_CONFIDENCE, AMBIGUOUS_TIE] } }
        - { name: owner, in: query, required: false, schema: { type: string } }
        - { name: after, in: query, required: false, schema: { type: integer, format: int64, minimum: 0, default: 0 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        '200':
          description: One page of cases
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CasePage' }
        '400': { $ref: '#/components/responses/CaseError' }
  /api/v1/exceptions/{id}:
    get:
      summary: Read one case in full
      description: >
        The case with its activity timeline, comments, assignments and the claim ledger rows that name it. Every
        part comes from one consistent snapshot.
      x-required-roles: [ADMIN, ANALYST, TEAM_LEAD, CONTROLLER, AUDITOR]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: The case
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseDetail' }
        '404': { $ref: '#/components/responses/CaseError' }
  /api/v1/exceptions/{id}/assign:
    post:
      summary: Assign a case to an owner
      description: >
        OPEN to ASSIGNED, or reassignment while ASSIGNED. The caller names the version it last read; a stale
        version is refused with 409.
      x-required-roles: [ADMIN, TEAM_LEAD]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { $ref: '#/components/parameters/Actor' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignRequest' }
            example: { expectedVersion: 0, owner: alice, reason: Picking this up }
      responses:
        '200':
          description: The updated case
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseSummary' }
        '400': { $ref: '#/components/responses/CaseError' }
        '404': { $ref: '#/components/responses/CaseError' }
        '409': { $ref: '#/components/responses/CaseError' }
  /api/v1/exceptions/{id}/investigate:
    post:
      summary: Start investigating a case
      description: ASSIGNED to INVESTIGATING. The case must have an owner.
      x-required-roles: [ADMIN, ANALYST, TEAM_LEAD]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { $ref: '#/components/parameters/Actor' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvestigateRequest' }
            example: { expectedVersion: 1 }
      responses:
        '200':
          description: The updated case
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseSummary' }
        '400': { $ref: '#/components/responses/CaseError' }
        '404': { $ref: '#/components/responses/CaseError' }
        '409': { $ref: '#/components/responses/CaseError' }
  /api/v1/exceptions/{id}/escalate:
    post:
      summary: Escalate a case
      description: INVESTIGATING to ESCALATED, with a mandatory reason.
      x-required-roles: [ADMIN, TEAM_LEAD]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { $ref: '#/components/parameters/Actor' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EscalateRequest' }
            example: { expectedVersion: 2, reason: Needs a senior analyst }
      responses:
        '200':
          description: The updated case
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseSummary' }
        '400': { $ref: '#/components/responses/CaseError' }
        '404': { $ref: '#/components/responses/CaseError' }
        '409': { $ref: '#/components/responses/CaseError' }
  /api/v1/exceptions/{id}/comments:
    post:
      summary: Add a comment to a case
      description: Comments are append-only and appear on the case timeline.
      x-required-roles: [ADMIN, ANALYST, TEAM_LEAD]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { $ref: '#/components/parameters/Actor' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommentRequest' }
            example: { body: Called the bank and they confirmed the payer }
      responses:
        '201':
          description: Comment recorded
          headers:
            Location: { schema: { type: string }, description: '/api/v1/exceptions/{id}' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommentCreated' }
        '400': { $ref: '#/components/responses/CaseError' }
        '404': { $ref: '#/components/responses/CaseError' }
  /api/v1/exceptions/{id}/match:
    post:
      summary: Resolve a case by manual match or split
      description: >
        INVESTIGATING to RESOLVED by matching statement lines to ledger entries. One line against one is a manual
        match. One against up to 8 on the other side is a split. Both sides must be in one currency and sum to
        exactly the same amount. The case's own statement lines must be part of the match. A line already claimed
        elsewhere is refused with 409 and nothing is written. Write-off and adjustment resolutions need
        maker-checker and arrive in Phase 5.
      x-required-roles: [ADMIN, ANALYST, TEAM_LEAD]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { $ref: '#/components/parameters/Actor' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MatchRequest' }
            example: { expectedVersion: 2, reason: Same payer and the bank changed the reference, statementSeqs: [42], ledgerSeqs: [97] }
      responses:
        '200':
          description: The resolved case
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseSummary' }
        '400': { $ref: '#/components/responses/CaseError' }
        '404': { $ref: '#/components/responses/CaseError' }
        '409': { $ref: '#/components/responses/CaseError' }
        '422': { $ref: '#/components/responses/CaseError' }
  /api/v1/exceptions/{id}/unmatch:
    post:
      summary: Reverse the manual match of a resolved case
      description: >
        Releases the claims of the match and opens a new review case linked to this one. The resolved case stays
        RESOLVED and records that its match was reversed. Unmatching twice is refused with 409.
      x-required-roles: [ADMIN, TEAM_LEAD]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { $ref: '#/components/parameters/Actor' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UnmatchRequest' }
            example: { reason: Wrong payer }
      responses:
        '201':
          description: The new review case
          headers:
            Location: { schema: { type: string }, description: '/api/v1/exceptions/{id}' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseSummary' }
        '400': { $ref: '#/components/responses/CaseError' }
        '404': { $ref: '#/components/responses/CaseError' }
        '409': { $ref: '#/components/responses/CaseError' }
  /api/v1/reconciliations/runs/{runId}/matches/{ordinal}/unmatch:
    post:
      summary: Reverse an auto-confirmed run match
      description: >
        Releases the claims of the run match and opens a new review case with no linked case. The run result itself
        is never changed, so replay still reproduces the stored hash.
      x-required-roles: [ADMIN, TEAM_LEAD]
      parameters:
        - { name: runId, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: ordinal, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { $ref: '#/components/parameters/Actor' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UnmatchRequest' }
            example: { reason: Not the same invoice }
      responses:
        '201':
          description: The new review case
          headers:
            Location: { schema: { type: string }, description: '/api/v1/exceptions/{id}' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseSummary' }
        '400': { $ref: '#/components/responses/CaseError' }
        '404': { $ref: '#/components/responses/CaseError' }
        '409': { $ref: '#/components/responses/CaseError' }
components:
  parameters:
    Actor:
      name: X-Actor
      in: header
      required: true
      description: The acting user. Until authentication arrives in Phase 8 the caller names itself here.
      schema: { type: string, minLength: 1 }
  responses:
    CaseError:
      description: >
        Case error in the standard error shape. 400 ACTOR_REQUIRED, REQUEST_INVALID, INVALID_FILTER,
        INVALID_PAGE_PARAMETER, CASE_REQUEST_INVALID. 404 CASE_NOT_FOUND. 409 CASE_VERSION_CONFLICT,
        ILLEGAL_STATE_TRANSITION, CASE_OWNER_REQUIRED, MATCH_LINE_ALREADY_CLAIMED, NOTHING_TO_UNMATCH. 422
        MATCH_INVALID, MATCH_LINE_NOT_FOUND. A 409 means the world changed under the caller, so read the case again
        and retry. A 422 means the request can never succeed as sent.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example:
            code: CASE_VERSION_CONFLICT
            message: The case was changed by someone else
            correlationId: 6f1c2d9e-3b7a-4c1e-9d55-0a1b2c3d4e5f
            timestamp: '2026-10-30T16:30:00.123456Z'
            details: []
    Created:
      description: New ingestion stored
      headers:
        Location: { schema: { type: string }, description: '/api/v1/ingestions/{id}' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/IngestionResult' }
          example: { ingestionId: 1, acceptedCount: 1000, rejectedCount: 0, duplicate: false, ignoredElements: 0 }
    Duplicate:
      description: Same bytes already ingested; the original ingestion is returned, nothing is written
      content:
        application/json:
          schema: { $ref: '#/components/schemas/IngestionResult' }
          example: { ingestionId: 1, acceptedCount: 1000, rejectedCount: 0, duplicate: true, ignoredElements: 0 }
    Error:
      description: >
        Error. Codes: INGESTION_EMPTY_FILE, INGESTION_NO_DATA_ROWS, INGESTION_UNSUPPORTED_ENCODING,
        INGESTION_MALFORMED_CSV, INGESTION_INVALID_HEADER, INGESTION_MALFORMED_XML, INGESTION_MALFORMED_JSON (422);
        INGESTION_FILE_TOO_LARGE (413); INGESTION_UNSUPPORTED_MEDIA_TYPE (415); INGESTION_NOT_FOUND (404). Run endpoints list their own codes.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example:
            code: INGESTION_NO_DATA_ROWS
            message: The file has a header but no data rows
            correlationId: 6f1c2d9e-3b7a-4c1e-9d55-0a1b2c3d4e5f
            timestamp: '2026-10-20T16:30:00.123456Z'
            details: []
  schemas:
    IntakeResult:
      type: object
      required: [runId, exceptions, created, alreadyOpen]
      properties:
        runId: { type: integer, format: int64 }
        exceptions: { type: integer, description: Exceptions in the run }
        created: { type: integer, description: Cases opened by this call }
        alreadyOpen: { type: integer, description: Exceptions that already had a case }
    CaseSummary:
      type: object
      required: [id, kind, caseClass, amountMinor, currency, status, priority, team, routingRule, createdBusinessDate, slaBusinessDays, dueBusinessDate, version]
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string, enum: [MISSING_LEDGER, MISSING_STATEMENT, AMOUNT_MISMATCH, CURRENCY_MISMATCH, DUPLICATE_SUSPECT, LOW_CONFIDENCE, AMBIGUOUS_TIE] }
        caseClass: { type: string, enum: [BREAK, REVIEW], description: BREAK has no candidate pair; REVIEW needs a person to confirm one }
        amountMinor: { type: integer, format: int64, description: Amount in minor units of the currency }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        status: { type: string, enum: [OPEN, ASSIGNED, INVESTIGATING, RESOLVED, ESCALATED] }
        priority: { type: string, enum: [P1, P2, P3, P4], description: Priority assigned by the routing rules }
        team: { type: string, enum: [FX_TEAM, SENIOR_ANALYST, LEDGER_OPERATIONS, BANK_OPERATIONS, RECON_ANALYSTS, TEAM_LEAD], description: Team assigned by the routing rules }
        routingRule: { type: string, description: The routing rule that chose the team and priority }
        owner: { type: [string, 'null'] }
        createdBusinessDate: { type: string, format: date }
        slaBusinessDays: { type: integer }
        dueBusinessDate: { type: string, format: date }
        version: { type: integer, format: int64, description: Send this back as expectedVersion on the next write }
    CasePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CaseSummary' }
        nextAfter: { type: [integer, 'null'], format: int64, description: Pass as after for the next page; null on the last page }
    CaseDetail:
      type: object
      properties:
        summary: { $ref: '#/components/schemas/CaseSummary' }
        origin: { type: string, enum: [RUN, UNMATCH] }
        originRunId: { type: [integer, 'null'], format: int64 }
        originOrdinal: { type: [integer, 'null'] }
        linkedCaseId: { type: [integer, 'null'], format: int64 }
        resolutionType: { type: [string, 'null'], enum: [MANUAL_MATCH, SPLIT, null] }
        resolutionReason: { type: [string, 'null'] }
        resolvedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        activity:
          type: array
          items: { $ref: '#/components/schemas/CaseActivity' }
        comments:
          type: array
          items: { $ref: '#/components/schemas/CaseComment' }
        assignments:
          type: array
          items: { $ref: '#/components/schemas/CaseAssignment' }
        claims:
          type: array
          items: { $ref: '#/components/schemas/CaseClaim' }
    CaseActivity:
      type: object
      properties:
        ordinal: { type: integer }
        type: { type: string, enum: [CREATED, ASSIGNED, COMMENT_ADDED, STATUS_CHANGED, MATCH_ATTEMPTED, MATCH_REJECTED, ESCALATED, APPROVAL_REQUESTED, APPROVAL_APPROVED, APPROVAL_REJECTED, RESOLVED] }
        actor: { type: string }
        from: { type: [string, 'null'] }
        to: { type: [string, 'null'] }
        detail: { type: [string, 'null'] }
        at: { type: string, format: date-time }
    CaseComment:
      type: object
      properties:
        ordinal: { type: integer }
        author: { type: string }
        body: { type: string }
        at: { type: string, format: date-time }
    CaseAssignment:
      type: object
      properties:
        ordinal: { type: integer }
        owner: { type: string }
        team: { type: string, enum: [FX_TEAM, SENIOR_ANALYST, LEDGER_OPERATIONS, BANK_OPERATIONS, RECON_ANALYSTS, TEAM_LEAD] }
        assignedBy: { type: string }
        reason: { type: [string, 'null'] }
        at: { type: string, format: date-time }
    CaseClaim:
      type: object
      description: One row of the append-only claim ledger that names this case.
      properties:
        seq: { type: integer, format: int64 }
        action: { type: string, enum: [CLAIM, RELEASE] }
        source: { type: string, enum: [RUN_MATCH, MANUAL_MATCH, SPLIT, UNMATCH] }
        statementSeq: { type: [integer, 'null'], format: int64 }
        ledgerSeq: { type: [integer, 'null'], format: int64 }
        actor: { type: string }
    AssignRequest:
      type: object
      required: [expectedVersion, owner]
      properties:
        expectedVersion: { type: integer, format: int64 }
        owner: { type: string, minLength: 1 }
        reason: { type: string }
    InvestigateRequest:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, format: int64 }
    EscalateRequest:
      type: object
      required: [expectedVersion, reason]
      properties:
        expectedVersion: { type: integer, format: int64 }
        reason: { type: string, minLength: 1 }
    CommentRequest:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1 }
    CommentCreated:
      type: object
      properties:
        caseId: { type: integer, format: int64 }
        ordinal: { type: integer }
    MatchRequest:
      type: object
      required: [expectedVersion, reason, statementSeqs, ledgerSeqs]
      properties:
        expectedVersion: { type: integer, format: int64 }
        reason: { type: string, minLength: 1 }
        statementSeqs:
          type: array
          minItems: 1
          maxItems: 8
          items: { type: integer, format: int64 }
        ledgerSeqs:
          type: array
          minItems: 1
          maxItems: 8
          items: { type: integer, format: int64 }
    UnmatchRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1 }
    IngestionResult:
      type: object
      required: [ingestionId, acceptedCount, rejectedCount, duplicate, ignoredElements]
      properties:
        ingestionId: { type: integer, format: int64 }
        acceptedCount: { type: integer }
        rejectedCount: { type: integer }
        duplicate: { type: boolean }
        ignoredElements: { type: integer, description: Unsupported camt.053 elements skipped; not stored }
    IngestionDetail:
      type: object
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string, enum: [STATEMENT, LEDGER] }
        format: { type: string, enum: [CSV, CAMT053, JSON] }
        fileHash: { type: string, description: SHA-256 hex of the file identity }
        byteSize: { type: integer, format: int64 }
        acceptedCount: { type: integer }
        rejectedCount: { type: integer }
        ingestedAt: { type: string, format: date-time }
        rejectedLines:
          type: array
          items: { $ref: '#/components/schemas/RejectedLine' }
    RejectedLine:
      type: object
      properties:
        lineNumber: { type: integer, minimum: 1 }
        code: { type: string, description: See FRD section 4.6 }
        message: { type: string }
        rawExcerpt: { type: string, maxLength: 200 }
    LedgerEntry:
      type: object
      additionalProperties: false
      properties:
        account: { type: [string, 'null'] }
        booking_date: { type: [string, 'null'] }
        value_date: { type: [string, 'null'] }
        amount: { type: [string, 'null'], description: Plain decimal text such as -1250.50; a JSON number is refused }
        currency: { type: [string, 'null'] }
        reference: { type: [string, 'null'] }
        counterparty: { type: [string, 'null'] }
        narrative: { type: [string, 'null'] }
        entry_id: { type: [string, 'null'], description: "1 to 64 characters of letters, digits and . _ : / -" }
    ApiError:
      type: object
      required: [code, message, correlationId, timestamp, details]
      properties:
        code: { type: string }
        message: { type: string }
        correlationId: { type: string }
        timestamp: { type: string, format: date-time }
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              issue: { type: string }
    MatchingConfig:
      type: object
      description: Every field is optional in a request; an omitted field takes the BRD default shown.
      properties:
        autoThresholdMilli: { type: integer, default: 950, description: 'Score at or above which a match is confirmed automatically' }
        reviewThresholdMilli: { type: integer, default: 700, description: Score at or above which a match goes to review }
        dateWindowBusinessDays: { type: integer, default: 3, minimum: 1, maximum: 30 }
        lookbackBusinessDays: { type: integer, default: 10, minimum: 1, maximum: 60 }
        maxOneToManyCandidates: { type: integer, default: 8, minimum: 2, maximum: 12 }
        fuzzyMinSimilarityMilli: { type: integer, default: 600 }
        fuzzyCounterpartyWeightMilli: { type: integer, default: 600 }
    StartRunRequest:
      type: object
      required: [businessDate, statementIngestionIds]
      properties:
        businessDate: { type: string, format: date }
        statementIngestionIds: { type: array, minItems: 1, items: { type: integer, format: int64 } }
        config: { $ref: '#/components/schemas/MatchingConfig' }
    RunSummary:
      type: object
      properties:
        statementLines: { type: integer }
        ledgerEntries: { type: integer }
        matches: { type: integer }
        autoConfirmedMatches: { type: integer }
        reviewMatches: { type: integer }
        ambiguousGroups: { type: integer }
        exceptions: { type: integer }
        carriedForward: { type: integer }
        truncationNotes: { type: integer }
    RunDetail:
      type: object
      properties:
        id: { type: integer, format: int64 }
        status: { type: string, enum: [CREATED, RUNNING, COMPLETED, FAILED] }
        businessDate: { type: string, format: date }
        statementIngestionIds: { type: array, items: { type: integer, format: int64 } }
        ledgerCutoffSeq: { type: integer, format: int64, description: Highest ledger sequence the run may read }
        config: { $ref: '#/components/schemas/MatchingConfig' }
        createdAt: { type: string, format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        durationMillis: { type: [integer, 'null'], format: int64 }
        outputHash: { type: [string, 'null'], description: SHA-256 of the canonical output; set when the run completes }
        summary: { oneOf: [{ $ref: '#/components/schemas/RunSummary' }, { type: 'null' }] }
        failureReason: { type: [string, 'null'], description: Generic by design; the cause is in the server log }
    ReplayResult:
      type: object
      required: [runId, storedHash, replayedHash, identical]
      properties:
        runId: { type: integer, format: int64 }
        storedHash: { type: string }
        replayedHash: { type: string }
        identical: { type: boolean }
    ResultLine:
      type: object
      properties:
        source: { type: string, enum: [STATEMENT, LEDGER] }
        seq: { type: integer, format: int64 }
        reference: { type: string }
        amountMinor: { type: integer, format: int64, description: 'Signed minor units, never a decimal' }
        currency: { type: string, description: ISO 4217 code }
        valueDate: { type: string, format: date }
    MatchItem:
      type: object
      properties:
        ordinal: { type: integer }
        tier: { type: string, enum: [EXACT, TOLERANCE, FUZZY, ONE_TO_MANY] }
        scoreMilli: { type: integer, minimum: 0, maximum: 1000 }
        band: { type: string, enum: [AUTO_CONFIRM, REVIEW, EXCEPTION] }
        reason: { type: string }
        lines: { type: array, items: { $ref: '#/components/schemas/ResultLine' } }
    ExceptionItem:
      type: object
      properties:
        ordinal: { type: integer }
        kind: { type: string, enum: [MISSING_LEDGER, MISSING_STATEMENT, AMOUNT_MISMATCH, CURRENCY_MISMATCH, LOW_CONFIDENCE, AMBIGUOUS_TIE] }
        reason: { type: string }
        detail: { type: string }
        subjects: { type: array, items: { $ref: '#/components/schemas/ResultLine' } }
        candidates: { type: array, description: 'At most 3, only for ties and mismatches', items: { $ref: '#/components/schemas/ResultLine' } }
    ResultPage:
      type: object
      required: [runId, view, items, nextAfter]
      properties:
        runId: { type: integer, format: int64 }
        view: { type: string, enum: [matches, exceptions, carried-forward, notes] }
        items:
          type: array
          description: MatchItem, ExceptionItem, a ledger sequence (carried-forward) or a note (notes), by view
          items:
            oneOf:
              - { $ref: '#/components/schemas/MatchItem' }
              - { $ref: '#/components/schemas/ExceptionItem' }
              - { type: integer, format: int64 }
              - { type: string }
        nextAfter: { type: [integer, 'null'], format: int64, description: Cursor for the next page; null on the last page }